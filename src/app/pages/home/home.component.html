<main class="flex-1 p-8">
  <div class="rounded-2xl p-6 dashboard-card">
    @if (role === 'admin') {
    <div class="summary-cards flex space-x-6 mb-8">
      <div class="summary-card flex-1">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-gray-600 text-lg font-medium">Total Doctors</h3>
          <i class="fas fa-user-md text-xl text-teal-500"></i>
        </div>
        <p class="text-3xl font-bold text-gray-800">{{ totalDoctors }}</p>
        <p class="text-sm mt-2">
          <span class="text-green-500">
            <i class="fas fa-arrow-up mr-1"></i>+{{ totalDoctorsChange }}% from
            last month
          </span>
        </p>
      </div>
      <div class="summary-card flex-1">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-gray-600 text-lg font-medium">Total Patients</h3>
          <i class="fas fa-users text-xl text-teal-500"></i>
        </div>
        <p class="text-3xl font-bold text-gray-800">{{ totalPatients }}</p>
        <p class="text-sm mt-2">
          <span class="text-green-500">
            <i class="fas fa-arrow-up mr-1"></i>+{{ totalPatientsChange }}% from
            last month
          </span>
        </p>
      </div>
    </div>
    }
    <router-outlet></router-outlet>
  </div>
</main>
